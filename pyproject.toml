[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "scoreflash"
version = "0.1.0"
description = "Consultas sob demanda de estatisticas de futebol."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ScoreFlash" }]
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.scripts]
scoreflash = "scoreflash.cli:main"
scoreflash-api = "scoreflash.api:run"

[tool.vercel]
entrypoint = "app:app"

[project.optional-dependencies]
test = [
    "httpx2>=0.1",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.unittest]
start-directory = "tests"
